<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fancy Restaurant</title>
</head>
<body>
  <header>
    <h1>Fancy Restaurant</h1>
    <nav aria-label="Main navigation">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'reservation-list' %}">Reservations</a>
      {% if logged_in_user %}
        <span>Hi, {{ logged_in_user.name }}!</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
      {% endif %}
    </nav>
  </header>
  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer>Fancy Restaurant</footer>
</body>
</html>
