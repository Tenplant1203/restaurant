{% extends "RestaurantApp/base.html" %}

{% block main %}
  <h2>New Reservation</h2>
  <form
    method="post"
    action="{% url 'reservation-list' %}"
  >
    {% csrf_token %}
    {{ form.as_p }}
    <div id="availability-result"></div>
    <button type="submit">Reserve</button>
  </form>
{% endblock %}
