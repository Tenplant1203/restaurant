{% extends "RestaurantApp/base.html" %}

{% block main %}
  <section class="auth-layout">
    <div class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Login</h1>
      <p class="auth-intro">Manage your upcoming reservations in one place.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
      </form>
      <p class="auth-switch">New to Fancy Restaurant? <a href="{% url 'register' %}">Create an account</a>.</p>
    </div>
  </section>
{% endblock %}
