[project]
name = "restaurant"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2.15",
    "django-htmx>=1.28.0",
    "psycopg2-binary>=2.9.12",
    "waitress>=3.0.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.14.3",
    "pylint>=4.0.6",
    "pylint-django>=2.7.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]

[tool.coverage.run]
omit = [
    "manage.py",
    "*/migrations/*",
    "*/asgi.py",
    "*/wsgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
